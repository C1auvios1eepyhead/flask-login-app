<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f2f2f2;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .gif-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 两列 */
            gap: 20px;
            margin-top: 30px;
        }
        .gif-grid img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome, {{ username }}!</h1>
        <div class="gif-grid">
            <img src="{{ url_for('static', filename='GIF/1.gif') }}" alt="gif1">
            <img src="{{ url_for('static', filename='GIF/2.gif') }}" alt="gif2">
            <img src="{{ url_for('static', filename='GIF/3.gif') }}" alt="gif3">
            <img src="{{ url_for('static', filename='GIF/4.gif') }}" alt="gif4">
        </div>
    </div>
    <div style="text-align:center; margin-top:20px;">
    <a href="/logout">
        <button style="
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: #e74c3c;
            color: white;
            cursor: pointer;
        ">
            Logout
        </button>
    </a>
</div>
</body>
</html>
