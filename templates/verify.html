<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Code</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #55efc4, #81ecec);
            font-family: Arial, sans-serif;
        }

        .container {
            background: #ffffffdd;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
        }

        .container h2 {
            margin-bottom: 20px;
            color: #2d3436;
        }

        .code-box {
            font-size: 26px;
            font-weight: bold;
            padding: 10px;
            margin-bottom: 20px;
            background: #dfe6e9;
            border-radius: 8px;
            color: #2d3436;
            letter-spacing: 3px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #dfe6e9;
            font-size: 14px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #00cec9;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.25s;
        }

        input[type="submit"]:hover {
            background: #00b4b0;
        }

        a {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: #0984e3;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Verify Email</h2>

    <p>Your verification code:</p>
    <div class="code-box">{{ code }}</div>

    <form action="/verify" method="post">
        <input type="range" id="slider" min="0" max="9999" value="0" name="code">
        <p>Current value: <span id="sliderValue">0</span></p>
        <input type="submit" value="Verify">
        <a href="/register">Back to Register</a>
    </form>
    <script>
    const slider = document.getElementById("slider");
    const display = document.getElementById("sliderValue");
    const hiddenCode = document.getElementById("hiddenCode");

    slider.addEventListener("input", () => {
        display.textContent = slider.value;
        hiddenCode.value = slider.value;
    });
    </script>
    {% for msg in get_flashed_messages() %}
    <p style="color:red">{{ msg }}</p>
    {% endfor %}
</div>

</body>
</html>
