<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #55efc4, #81ecec);
            font-family: Arial, sans-serif;
        }

        .container {
            background: #ffffffdd;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
        }

        .container h2 {
            margin-bottom: 25px;
            color: #2d3436;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #dfe6e9;
            font-size: 14px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #00cec9;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.25s;
        }

        input[type="submit"]:hover {
            background: #00b4b0;
        }

        a {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: #0984e3;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Register</h2>
    <form action="/register" method="post">
        <input type="email" name="email" placeholder="Enter your Email" required value="{{username|default('')}}">
        <input type="text" name="username" placeholder = "Enter your username" required value="{{ email|default('') }}">
        <input type="password" name="password" placeholder="Enter your password" required>
        <small style="display:block; color: #636e72; margin-bottom:5px; margin-left:10px; text-align:left;">
            Password must be 6-12 characters, including letters and numbers.
        </small>
        <input type="password" name="password_check" placeholder="Confirm your password" required>
        <input type="submit" value="Register">
        <a href="/login">Back to Login</a>
    </form>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul style="color:red; text-align:left; padding-left:0; list-style-position: inside;">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
</div>

</body>
</html>
