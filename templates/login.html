<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            font-family: Arial, sans-serif;
        }

        .container {
            background: #ffffffdd;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
        }

        .container h2 {
            margin-bottom: 25px;
            color: #2d3436;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #dfe6e9;
            font-size: 14px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #6c5ce7;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.25s;
        }

        input[type="submit"]:hover {
            background: #5a4bd1;
        }

        a {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: #0984e3;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Log In</h2>
    <form action="/login" method="post">
        <input type="text" name="username" placeholder="Enter your name or email" required value="{{username|default('')}}">
        <input type="password" name="password" placeholder="Enter your password" required>
        <input type="submit" value="Log In">
        <a href="register">Register</a>
    </form>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul style="color:red; text-align:left; padding-left:0; list-style-position: inside;">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
</div>

</body>
</html>
